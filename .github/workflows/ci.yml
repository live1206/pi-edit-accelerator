name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (Pi ${{ matrix.pi }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pi: ["0.85.1", "1.1.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - if: matrix.pi != '0.85.1'
        run: npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps @earendil-works/pi-coding-agent@${{ matrix.pi }}
      - run: npm run check
      - run: npm test
