name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: PI_EDIT_ACCELERATOR_NATIVE=0 npm test

  native-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: npm ci --ignore-scripts
      - run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - run: cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - run: npm run native:test
      - run: npm run native:package:linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64-gnu
          path: .artifacts/live1206-pi-edit-accelerator-linux-x64-gnu-*.tgz
          if-no-files-found: error
