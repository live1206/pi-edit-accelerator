[package]
name = "pi-edit-accelerator-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
memchr = "2.7"
napi = { version = "3.12", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3.5"

[build-dependencies]
napi-build = "2.2"

[profile.release]
lto = true
strip = "symbols"
